# Names and descriptions are in strings.json and the translations
alarm_reset:
  target:
    entity:
      - integration: inim_smartliving_alarm
        domain: alarm_control_panel

reread_panel_configuration:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: inim_smartliving_alarm

arm_area:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: inim_smartliving_alarm
    areas:
      required: true
      example: "[1, 3]"
      selector:
        select:
          multiple: true
          # Filled in while the integration runs: the imported areas of the
          # loaded panels
          options: []
    mode:
      required: true
      selector:
        select:
          translation_key: arm_area_mode
          options:
            - total
            - partial
            - instant
            - disarm
    force:
      default: false
      selector:
        boolean:

activate_scenario:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: inim_smartliving_alarm
    scenario:
      required: true
      example: "2"
      selector:
        select:
          # Filled in while the integration runs: the imported scenarios of
          # the loaded panels
          options: []
    force:
      default: false
      selector:
        boolean:
