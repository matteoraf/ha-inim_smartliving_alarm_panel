version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    # Only the documentation site's packages: the test requirements pin
    # Home Assistant releases on purpose.
    allow:
      - dependency-name: mkdocs
      - dependency-name: mkdocs-material
      - dependency-name: mike
